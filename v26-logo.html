<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V26 Inference — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Nexon';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON%20Lv1%20Gothic%20OTF.woff') format('woff');
    font-weight:300 700;
    font-display:swap;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family: 'Nexon','NEXON Lv1 Gothic', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif;
    background:#f6f7f8;
    color:#111;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:40px 20px;
  }
  .caption{
    margin-top:18px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#9aa0a6;
    font-weight:500;
  }
  .logo-wrap{
    background:#ffffff;
    border:1px solid #eceef2;
    border-radius:18px;
    padding:48px 56px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 20px 40px -16px rgba(16,24,40,.08);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:8px; /* zoomed ref: ~8px white gap 6↔triangle and triangle↔I — optical, not 0 */
    line-height:1;
    user-select:none;
  }
  .logo-text{
    font-family: 'Nexon','NEXON Lv1 Gothic', Inter, system-ui, -apple-system, sans-serif;
    font-weight:700;
    font-size:68px;
    letter-spacing:-0.02em;
    color:#531eba;
    line-height:1;
    display:inline-block;
    transform:translateY(1px);
    -webkit-font-smoothing:antialiased;
  }
  .logo-text.inference{
    font-weight:700;
    letter-spacing:-0.02em;
    margin-left:0;
  }
  .logo-mark{
    width:68px; /* big as V26 — same as cap-height */
    height:68px;
    flex:none;
    display:block;
    overflow:visible;
    transform:translateY(2px);
    margin:0; /* no extra gap */
  }
  .row{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:26px;
  }
  .logo-wrap.dark{
    background:#0a0a0f;
    border-color:#1e1e26;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,.5);
  }
  .logo-wrap.dark .logo-text{ color:#6d3df0; }
  .logo-wrap.mini{
    padding:26px 28px;
    border-radius:14px;
  }
  .logo-wrap.mini .logo-text{ font-size:36px; }
  .logo-wrap.mini .logo-mark{ width:36px; height:36px; margin:0; }
  .logo-wrap.mini .logo{ gap:0; }

  @media (max-width:640px){
    .logo-wrap{ padding:32px 22px; }
    .logo-text{ font-size:42px; }
    .logo-mark{ width:34px; height:34px; }
    .logo{ gap:8px; }
  }
</style>
</head>
<body>

  <!-- Primary lockup — pixel-perfect to reference image -->
  <div class="logo-wrap" aria-label="V26 Inference logo">
    <div class="logo" role="img" aria-label="V26 Inference">
      <span class="logo-text">V26</span>

      </svg>

      <span class="logo-text inference">Inference</span>
    </div>
  </div>
  <div class="caption">V26 Inference — primary lockup · #531EBA · Nexon · icon 68px (same as V26) · gap 0</div>
